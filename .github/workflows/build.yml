name: Numination build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.0
          ENV

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: flutter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name numination .

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p android/keystore

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '\r\n' \
            | base64 --decode \
            > android/keystore/numination-release.jks

          test -s android/keystore/numination-release.jks
          chmod 600 android/keystore/numination-release.jks

          echo "Release keystore restored successfully."

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="android/keystore/numination-release.jks"
          TEMP_KEYSTORE="$RUNNER_TEMP/numination-signing-check.jks"
          TEMP_P12="$RUNNER_TEMP/numination-key-check.p12"

          rm -f "$TEMP_KEYSTORE"
          rm -f "$TEMP_P12"

          cp "$KEYSTORE" "$TEMP_KEYSTORE"

          echo "Checking keystore password and alias..."

          keytool -list \
            -keystore "$TEMP_KEYSTORE" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Keystore password + alias: OK"

          echo "Checking private-key password..."

          keytool -importkeystore \
            -srckeystore "$TEMP_KEYSTORE" \
            -srcstoretype JKS \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore "$TEMP_P12" \
            -deststoretype PKCS12 \
            -deststorepass "CI_TEMP_CHECK_PASSWORD" \
            -destkeypass "CI_TEMP_CHECK_PASSWORD" \
            -noprompt

          test -s "$TEMP_P12"

          rm -f "$TEMP_KEYSTORE"
          rm -f "$TEMP_P12"

          echo "Private-key password: OK"
          echo "Release signing credentials: OK"

      - run: flutter pub get

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ../keystore/numination-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Rename APK
        run: |
          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Numination-release.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Numination-release-apk
          path: build/app/outputs/flutter-apk/Numination-release.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/Numination-release.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" \
              "$APK" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$APK" \
              --title "Numination $TAG" \
              --generate-notes
          fi

  ios:
    name: iOS build (unsigned)
    needs: flutter
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate iOS platform
        run: flutter create --platforms=ios --project-name numination .

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Numination-ios-unsigned-build
          path: build/ios/iphoneos/Runner.app

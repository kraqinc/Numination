name: Numination build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security audit
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep

      - name: Scan source code
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  generate-sparkle-keys:
    name: Generate Sparkle signing keys
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate and export EdDSA keypair
        run: |
          set -euo pipefail

          SPARKLE_VERSION="2.10.1"
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle.tar.xz"
          SPARKLE_DIR="$RUNNER_TEMP/sparkle"
          KEYCHAIN="$RUNNER_TEMP/numination-sparkle.keychain-db"
          PRIVATE_KEY="$RUNNER_TEMP/numination-ed25519.private"
          OUTPUT_DIR="$RUNNER_TEMP/numination-sparkle-keys"

          curl -fsSL --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$SPARKLE_ARCHIVE"

          mkdir -p "$SPARKLE_DIR" "$OUTPUT_DIR"
          tar -xJf "$SPARKLE_ARCHIVE" -C "$SPARKLE_DIR"

          GENERATE_KEYS="$(find "$SPARKLE_DIR" -type f -name generate_keys -print -quit)"
          test -n "$GENERATE_KEYS"
          test -x "$GENERATE_KEYS"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$PRIVATE_KEY" "$SPARKLE_ARCHIVE"
          }
          trap cleanup EXIT

          GENERATE_OUTPUT="$("$GENERATE_KEYS" 2>&1)"
          printf '%s\n' "$GENERATE_OUTPUT"

          PUBLIC_KEY="$(printf '%s\n' "$GENERATE_OUTPUT" | grep -Eo '[A-Za-z0-9+/]{43}=' | tail -n 1)"
          test -n "$PUBLIC_KEY"

          "$GENERATE_KEYS" -x "$PRIVATE_KEY"
          test -s "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"

          printf '%s\n' "$PUBLIC_KEY" > "$OUTPUT_DIR/SPARKLE_PUBLIC_KEY.txt"
          base64 < "$PRIVATE_KEY" | tr -d '\r\n' > "$OUTPUT_DIR/SPARKLE_EDDSA_PRIVATE_KEY_B64.txt"
          chmod 600 "$OUTPUT_DIR/SPARKLE_EDDSA_PRIVATE_KEY_B64.txt"

          {
            echo '## Sparkle public key'
            echo
            echo 'Save this value as the GitHub Actions secret `SPARKLE_PUBLIC_KEY`.'
            echo
            echo '\`\`\`text'
            cat "$OUTPUT_DIR/SPARKLE_PUBLIC_KEY.txt"
            echo '\`\`\`'
            echo
            echo 'The private-key artifact must be stored as the secret `SPARKLE_EDDSA_PRIVATE_KEY_B64` and then deleted from downloaded files.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private key and public key
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-Sparkle-Keys
          path: |
            ${{ runner.temp }}/numination-sparkle-keys/SPARKLE_PUBLIC_KEY.txt
            ${{ runner.temp }}/numination-sparkle-keys/SPARKLE_EDDSA_PRIVATE_KEY_B64.txt
          if-no-files-found: error
          retention-days: 1

  flutter:
    name: Flutter analyze & test
    needs: security
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.0
          ENV

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Scan dependency lockfile with OSV
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932
        with:
          scan-args: |-
            --recursive
            .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK
    needs: flutter
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Restore and convert release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE="$GITHUB_WORKSPACE/android/keystore/numination-release.jks"
          SOURCE_KEYSTORE="$RUNNER_TEMP/numination-source.p12"

          mkdir -p "$(dirname "$KEYSTORE")"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$SOURCE_KEYSTORE"

          test -s "$SOURCE_KEYSTORE"
          chmod 600 "$SOURCE_KEYSTORE"

          echo "Source keystore:"
          file "$SOURCE_KEYSTORE"

          rm -f "$KEYSTORE"

          keytool -importkeystore \
            -srckeystore "$SOURCE_KEYSTORE" \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -destkeystore "$KEYSTORE" \
            -deststoretype JKS \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEYSTORE_PASSWORD" \
            -noprompt

          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "Converted keystore:"
          file "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "JKS + alias: OK"

          rm -f "$SOURCE_KEYSTORE"

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/numination-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Gradle signing keystore:"
          echo "$ANDROID_KEYSTORE_PATH"

          test -f "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          flutter build apk \
            --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Prepare APK
        run: |
          set -euo pipefail

          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          APK="build/app/outputs/flutter-apk/Numination.apk"

          test -s "$APK_SOURCE"

          cp "$APK_SOURCE" "$APK"

          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner"

          "$APKSIGNER" verify --verbose "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"

          printf '%s  %s\n' \
            "$SHA256" \
            "Numination.apk" \
            > build/app/outputs/flutter-apk/SHA256SUMS.txt

          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Numination.apk"
          echo "Size: $SIZE bytes"
          echo "SHA-256: $SHA256"
          echo "Signature: VERIFIED"
          echo "========================================"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-release-apk
          path: |
            build/app/outputs/flutter-apk/Numination.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/Numination.apk"
          CHECKSUM="build/app/outputs/flutter-apk/SHA256SUMS.txt"
          EXPECTED_SHA="${{ github.sha }}"

          if TAG_RESPONSE="$(gh api \
            "repos/${{ github.repository }}/git/ref/tags/$TAG" \
            --silent 2>/dev/null)"; then

            TAG_SHA="$(printf '%s' "$TAG_RESPONSE" | jq -r '.object.sha')"

            echo "Existing tag $TAG points to:"
            echo "$TAG_SHA"

            if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
              echo ""
              echo "ERROR: Release tag $TAG points to:"
              echo "$TAG_SHA"
              echo ""
              echo "But this APK was built from:"
              echo "$EXPECTED_SHA"
              echo ""
              echo "Refusing to publish a mismatched release."
              exit 1
            fi

            echo "Tag points to the expected commit."

          else
            echo "Tag $TAG does not exist yet."
            echo "GitHub Release creation will create the tag."
          fi

          DESCRIPTION="$(cat <<EOF
          ## Numination $TAG

          **Numination AI — AI Workspace & Shell**

          La IA para quienes resuelven problemas.

          ### Android

          - **APK:** \`Numination.apk\`
          - **Tamaño:** ${APK_SIZE} bytes
          - **SHA-256:** \`${APK_SHA256}\`
          - **Firma:** verificada
          - **Build:** ${{ github.run_number }}
          - **Commit:** \`${{ github.sha }}\`

          ### Integridad del APK

          Este es exactamente el mismo APK generado y validado por GitHub Actions en esta ejecución.

          El archivo publicado en Releases no se recompila ni se genera nuevamente.
          Se publica directamente el APK producido por el job de Android.

          SHA-256 oficial:

          \`${APK_SHA256}\`

          ### Build information

          - Flutter: 3.47.0
          - Version: 1.0.${{ github.run_number }}
          - Commit: \`${{ github.sha }}\`
          - APK signature verification: passed
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."

            gh release upload \
              "$TAG" \
              "$APK" \
              "$CHECKSUM" \
              --clobber

            gh release edit "$TAG" \
              --title "Numination $TAG" \
              --notes "$DESCRIPTION"

          else
            echo "Creating release $TAG..."

            gh release create \
              "$TAG" \
              "$APK" \
              "$CHECKSUM" \
              --title "Numination $TAG" \
              --notes "$DESCRIPTION"
          fi

          echo "Release published successfully:"
          echo "$TAG"
          echo "APK: Numination.apk"
          echo "SHA-256: $APK_SHA256"

  ios:
    name: Build iOS IPA (unsigned)
    needs: flutter
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS app
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_SOURCE="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          IPA_NAME="Numination-unsigned.ipa"

          test -d "$APP_SOURCE"

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          /usr/bin/ditto \
            "$APP_SOURCE" \
            "$IPA_DIR/Payload/Runner.app"

          (
            cd "$IPA_DIR"
            /usr/bin/ditto -c -k \
              --sequesterRsrc \
              --keepParent \
              Payload \
              "$IPA_NAME"
          )

          test -s "$IPA_DIR/$IPA_NAME"
          /usr/bin/unzip -t "$IPA_DIR/$IPA_NAME"

          SHA256="$(
            shasum -a 256 "$IPA_DIR/$IPA_NAME" |
            awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$SHA256" "$IPA_NAME" \
            > "$IPA_DIR/SHA256SUMS-ios.txt"

          echo "IPA SHA-256: $SHA256"
          echo "IPA package: VERIFIED"
          echo "Code signing: NOT APPLIED"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-ios-unsigned-ipa
          if-no-files-found: error
          path: |
            build/ios/ipa/Numination-unsigned.ipa
            build/ios/ipa/SHA256SUMS-ios.txt

  publish-ios-ipa:
    name: Attach IPA to GitHub Release
    needs:
      - android
      - ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: Numination-ios-unsigned-ipa
          path: release-assets

      - name: Verify IPA
        run: |
          set -euo pipefail

          test -s release-assets/Numination-unsigned.ipa

          (
            cd release-assets
            sha256sum -c SHA256SUMS-ios.txt
          )

          unzip -t release-assets/Numination-unsigned.ipa

      - name: Publish IPA to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.${{ github.run_number }}"

          gh release upload "$TAG" \
            release-assets/Numination-unsigned.ipa \
            release-assets/SHA256SUMS-ios.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber


  windows:
    name: Windows x64 installer
    needs: flutter
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        shell: pwsh
        run: |
          $content = @"
          SUPABASE_URL=$env:SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$env:SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$env:API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          "@
          [System.IO.File]::WriteAllText("$PWD/.env", $content, [System.Text.UTF8Encoding]::new($false))

      - name: Generate Windows runner
        run: flutter create --platforms=windows --org com.wren.ide --project-name numination .

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --build-name "1.0.${{ github.run_number }}" --build-number "${{ github.run_number }}"

      - name: Install Windows updater dependency
        run: choco install openssl --yes --no-progress

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw "No se encontró ISCC.exe: $iscc" }

          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "windows/installer/Numination.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Falló Inno Setup.' }

          $installer = 'build/windows/package/Numination-Setup.exe'
          if (!(Test-Path -LiteralPath $installer)) { throw 'No se generó Numination-Setup.exe.' }

          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Numination-Setup.exe" | Set-Content -Encoding ascii 'build/windows/package/SHA256SUMS-windows.txt'
          $verified = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $verified) { throw 'El SHA-256 del instalador no coincide.' }
          Write-Host "Numination-Setup.exe SHA-256: $sha"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-windows-installer
          path: |
            build/windows/package/Numination-Setup.exe
            build/windows/package/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64 AppImage
    needs: flutter
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libfuse2 file curl libglib2.0-dev librsvg2-dev \
            libgirepository1.0-dev imagemagick libwebkit2gtk-4.1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Generate Linux runner
        run: flutter create --platforms=linux --org com.wren.ide --project-name numination .

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: flutter build linux --release --build-name "1.0.${{ github.run_number }}" --build-number "${{ github.run_number }}"

      - name: Create AppImage and SHA-256
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail

          BUNDLE="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          APPDIR="$GITHUB_WORKSPACE/build/linux/AppDir"
          TOOLS="$GITHUB_WORKSPACE/build/linux/appimage-tools"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build/linux/package"
          OUTPUT="$OUTPUT_DIR/Numination-x86_64.AppImage"

          mkdir -p "$APPDIR/usr/bin" "$TOOLS" "$OUTPUT_DIR"

          cp -a "$BUNDLE"/. "$APPDIR/usr/bin/"

          convert "$GITHUB_WORKSPACE/assets/images/logo/logo_n.png" \
            -background none \
            -resize 512x512 \
            -gravity center \
            -extent 512x512 \
            -strip \
            "$APPDIR/numination.png"

          ICON_SIZE="$(identify -format '%wx%h' "$APPDIR/numination.png")"

          if [ "$ICON_SIZE" != "512x512" ]; then
            echo "ERROR: Dimensiones incorrectas: $ICON_SIZE"
            exit 1
          fi

          echo "AppImage icon: $ICON_SIZE - VERIFIED"

          cat > "$APPDIR/Numination.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Numination
          Comment=Numination AI workspace
          Exec=AppRun
          Icon=numination
          Terminal=false
          Categories=Development;Utility;
          StartupNotify=true
          DESKTOP

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          set -eu
          HERE="$(dirname "$(readlink -f "$0")")"
          export APPDIR="$HERE"
          if [ -d "$HERE/apprun-hooks" ]; then
            for hook in "$HERE"/apprun-hooks/*.sh; do
              [ -f "$hook" ] && . "$hook"
            done
          fi
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/bin/numination" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/numination"

          curl -fsSL --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$TOOLS/linuxdeploy-x86_64.AppImage"
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            -o "$TOOLS/linuxdeploy-plugin-gtk.sh"
          chmod +x "$TOOLS/linuxdeploy-x86_64.AppImage" "$TOOLS/linuxdeploy-plugin-gtk.sh"
          mv "$TOOLS/linuxdeploy-plugin-gtk.sh" "$TOOLS/linuxdeploy-plugin-gtk"
          export PATH="$TOOLS:$PATH"

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LINUXDEPLOY_OUTPUT_APP_NAME=Numination
          export LINUXDEPLOY_OUTPUT_VERSION="$APP_VERSION"
          export OUTPUT="$OUTPUT"

          "$TOOLS/linuxdeploy-x86_64.AppImage" \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/numination" \
            --desktop-file "$APPDIR/Numination.desktop" \
            --icon-file "$APPDIR/numination.png" \
            --plugin gtk \
            --output appimage

          test -s "$OUTPUT"

          SHA256="$(sha256sum "$OUTPUT" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "Numination-x86_64.AppImage" > "$OUTPUT_DIR/SHA256SUMS-linux.txt"

          echo "========================================"
          echo "Numination-x86_64.AppImage"
          echo "SHA-256: $SHA256"
          echo "========================================"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-linux-appimage
          path: |
            build/linux/package/Numination-x86_64.AppImage
            build/linux/package/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

  publish-desktop:
    name: Publish Windows installer and Linux AppImage
    needs:
      - android
      - windows
      - linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8.0.2
        with:
          name: Numination-windows-installer
          path: release-assets/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v8.0.2
        with:
          name: Numination-linux-appimage
          path: release-assets/linux

      - name: Verify desktop assets
        run: |
          set -euo pipefail
          test -s release-assets/windows/Numination-Setup.exe
          test -s release-assets/windows/SHA256SUMS-windows.txt
          test -s release-assets/linux/Numination-x86_64.AppImage
          test -s release-assets/linux/SHA256SUMS-linux.txt
          (cd release-assets/windows && sha256sum -c SHA256SUMS-windows.txt)
          (cd release-assets/linux && sha256sum -c SHA256SUMS-linux.txt)

      - name: Publish desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"

          gh release upload "$TAG" \
            release-assets/windows/Numination-Setup.exe \
            release-assets/windows/SHA256SUMS-windows.txt \
            release-assets/linux/Numination-x86_64.AppImage \
            release-assets/linux/SHA256SUMS-linux.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          WINDOWS_SHA="$(awk '{print $1}' release-assets/windows/SHA256SUMS-windows.txt)"
          LINUX_SHA="$(awk '{print $1}' release-assets/linux/SHA256SUMS-linux.txt)"
          WINDOWS_SIZE="$(stat -c '%s' release-assets/windows/Numination-Setup.exe)"
          LINUX_SIZE="$(stat -c '%s' release-assets/linux/Numination-x86_64.AppImage)"

          CURRENT_NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          if ! grep -q '### Linux x86_64 AppImage' <<< "$CURRENT_NOTES"; then
            DESCRIPTION="$(cat <<EOF
          ${CURRENT_NOTES}

          ### Windows x64
          - Installer: Numination-Setup.exe
          - Size: ${WINDOWS_SIZE} bytes
          - SHA-256: ${WINDOWS_SHA}

          ### Linux x86_64 AppImage
          - AppImage: Numination-x86_64.AppImage
          - Size: ${LINUX_SIZE} bytes
          - SHA-256: ${LINUX_SHA}
          EOF
          )"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$DESCRIPTION"
          fi
  macos:
    name: macOS DMG and Sparkle signing
    needs: flutter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Generate macOS runner
        run: |
          set -euo pipefail
          if [ ! -d macos/Runner.xcodeproj ]; then
            flutter create --platforms=macos --org com.wren.ide --project-name numination .
          fi

      - name: Configure Sparkle and macOS entitlements
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PUBLIC_KEY:?Missing SPARKLE_PUBLIC_KEY secret. Run this workflow manually once to generate the keys, then add both GitHub Secrets.}"
          export SPARKLE_PUBLIC_KEY
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          from pathlib import Path

          root = Path("macos/Runner")
          info_path = root / "Info.plist"
          public_key = os.environ["SPARKLE_PUBLIC_KEY"].strip()
          decoded = base64.b64decode(public_key, validate=True)
          if len(decoded) != 32:
              raise SystemExit("SPARKLE_PUBLIC_KEY must decode to 32 bytes")

          with info_path.open("rb") as handle:
              info = plistlib.load(handle)
          info["CFBundleName"] = "Numination"
          info["CFBundleDisplayName"] = "Numination"
          info["SUFeedURL"] = "https://github.com/kraqinc/Numination/releases/latest/download/appcast.xml"
          info["SUPublicEDKey"] = public_key
          info["SUEnableAutomaticChecks"] = True
          with info_path.open("wb") as handle:
              plistlib.dump(info, handle, fmt=plistlib.FMT_XML, sort_keys=False)

          for name in ("DebugProfile.entitlements", "Release.entitlements"):
              path = root / name
              with path.open("rb") as handle:
                  entitlements = plistlib.load(handle)
              entitlements["com.apple.security.app-sandbox"] = False
              entitlements["com.apple.security.network.client"] = True
              entitlements["com.apple.security.network.server"] = True
              with path.open("wb") as handle:
                  plistlib.dump(entitlements, handle, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build macOS Release
        run: |
          set -euo pipefail
          flutter build macos \
            --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"

          STAGING="$RUNNER_TEMP/Numination-DMG"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build/macos/package"
          DMG="$OUTPUT_DIR/Numination-macOS.dmg"

          rm -rf "$STAGING" "$OUTPUT_DIR"
          mkdir -p "$STAGING" "$OUTPUT_DIR"
          /usr/bin/ditto "$APP_PATH" "$STAGING/Numination.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "Numination" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG"

          test -s "$DMG"
          hdiutil verify "$DMG"

          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "Numination-macOS.dmg" > "$OUTPUT_DIR/SHA256SUMS-macos.txt"

      - name: Sign DMG and generate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY_B64: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY_B64 }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_EDDSA_PRIVATE_KEY_B64:?Missing SPARKLE_EDDSA_PRIVATE_KEY_B64 secret. Generate the keypair through workflow_dispatch and save the private key as a GitHub Secret.}"
          : "${SPARKLE_PUBLIC_KEY:?Missing SPARKLE_PUBLIC_KEY secret.}"

          SPARKLE_VERSION="2.10.1"
          SPARKLE_ARCHIVE="$RUNNER_TEMP/Sparkle.tar.xz"
          SPARKLE_DIR="$RUNNER_TEMP/sparkle"
          PRIVATE_KEY="$RUNNER_TEMP/numination-ed25519.private"
          KEYCHAIN="$RUNNER_TEMP/numination-sparkle.keychain-db"
          DMG="$GITHUB_WORKSPACE/build/macos/package/Numination-macOS.dmg"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build/macos/package"

          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY_B64" | base64 --decode > "$PRIVATE_KEY"
          test -s "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"
          unset SPARKLE_EDDSA_PRIVATE_KEY_B64

          curl -fsSL --retry 3 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$SPARKLE_ARCHIVE"
          mkdir -p "$SPARKLE_DIR"
          tar -xJf "$SPARKLE_ARCHIVE" -C "$SPARKLE_DIR"

          GENERATE_KEYS="$(find "$SPARKLE_DIR" -type f -name generate_keys -print -quit)"
          SIGN_UPDATE="$(find "$SPARKLE_DIR" -type f -name sign_update -print -quit)"
          test -x "$GENERATE_KEYS"
          test -x "$SIGN_UPDATE"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$PRIVATE_KEY" "$SPARKLE_ARCHIVE"
          }
          trap cleanup EXIT

          "$GENERATE_KEYS" -f "$PRIVATE_KEY"
          IMPORTED_PUBLIC_KEY="$("$GENERATE_KEYS" 2>&1 | grep -Eo '[A-Za-z0-9+/]{43}=')"
          test "$IMPORTED_PUBLIC_KEY" = "$SPARKLE_PUBLIC_KEY"
          unset SPARKLE_PUBLIC_KEY

          SIGNATURE_OUTPUT="$("$SIGN_UPDATE" "$DMG")"
          SIGNATURE="$(printf '%s\n' "$SIGNATURE_OUTPUT" | sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p' | head -n 1)"
          test -n "$SIGNATURE"

          VERSION="1.0.${{ github.run_number }}"
          BUILD_NUMBER="${{ github.run_number }}"
          TAG="v${VERSION}"
          SIZE="$(stat -f%z "$DMG")"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Numination-macOS.dmg"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S GMT')"
          APPCAST="$OUTPUT_DIR/appcast.xml"

          cat > "$APPCAST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Numination</title>
              <description>Numination macOS updates</description>
              <language>es</language>
              <item>
                <title>Numination ${VERSION}</title>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:releaseNotesLink>${RELEASE_URL}</sparkle:releaseNotesLink>
                <pubDate>${PUB_DATE}</pubDate>
                <enclosure url="${DOWNLOAD_URL}" sparkle:edSignature="${SIGNATURE}" sparkle:os="macos" length="${SIZE}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          test -s "$APPCAST"
          plutil -lint "$GITHUB_WORKSPACE/macos/Runner/Info.plist"
          echo "Sparkle appcast generated for ${VERSION}."

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-macos-release
          path: |
            build/macos/package/Numination-macOS.dmg
            build/macos/package/SHA256SUMS-macos.txt
            build/macos/package/appcast.xml
          if-no-files-found: error
          retention-days: 30

  publish-macos:
    name: Publish macOS DMG and appcast
    needs:
      - android
      - macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS release artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: Numination-macos-release
          path: release-assets

      - name: Verify macOS release files
        run: |
          set -euo pipefail
          test -s release-assets/Numination-macOS.dmg
          test -s release-assets/SHA256SUMS-macos.txt
          test -s release-assets/appcast.xml
          (cd release-assets && sha256sum -c SHA256SUMS-macos.txt)
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path("release-assets/appcast.xml")).getroot()
          ns = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          sparkle = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          item = root.find("./channel/item")
          assert item is not None
          assert item.find("sparkle:version", ns) is not None
          enclosure = item.find("enclosure")
          assert enclosure is not None
          assert enclosure.attrib.get(sparkle + "edSignature")
          assert enclosure.attrib.get(sparkle + "os") == "macos"
          PY

      - name: Attach macOS files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          gh release upload "$TAG" \
            release-assets/Numination-macOS.dmg \
            release-assets/SHA256SUMS-macos.txt \
            release-assets/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Published macOS DMG and Sparkle appcast in ${TAG}."

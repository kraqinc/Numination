
name: Numination Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze & test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932
        with:
          scan-args: |
            --recursive
            .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android Signed APK
    needs: flutter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE="$GITHUB_WORKSPACE/android/keystore/numination-release.jks"
          SOURCE="$RUNNER_TEMP/numination-source.p12"

          mkdir -p "$(dirname "$KEYSTORE")"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '\r\n' \
            | base64 --decode > "$SOURCE"

          test -s "$SOURCE"
          chmod 600 "$SOURCE"

          keytool -importkeystore \
            -srckeystore "$SOURCE" \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -destkeystore "$KEYSTORE" \
            -deststoretype JKS \
            -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -destkeypass "$ANDROID_KEYSTORE_PASSWORD" \
            -noprompt

          keytool -list \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          chmod 600 "$KEYSTORE"
          rm -f "$SOURCE"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/numination-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -s "$ANDROID_KEYSTORE_PATH"

          flutter build apk \
            --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Verify and prepare APK
        run: |
          set -euo pipefail

          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          OUTPUT="build/app/outputs/flutter-apk/Numination.apk"

          test -s "$SOURCE"
          cp "$SOURCE" "$OUTPUT"

          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner"

          "$APKSIGNER" verify --verbose "$OUTPUT"

          SHA256="$(sha256sum "$OUTPUT" | awk '{print $1}')"

          printf '%s  %s\n' \
            "$SHA256" \
            "Numination.apk" \
            > build/app/outputs/flutter-apk/SHA256SUMS-android.txt

          echo "Android signature verified."
          echo "SHA-256: $SHA256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-android
          path: |
            build/app/outputs/flutter-apk/Numination.apk
            build/app/outputs/flutter-apk/SHA256SUMS-android.txt
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA
    needs: flutter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --no-codesign \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Package IPA
        run: |
          set -euo pipefail

          APP="build/ios/iphoneos/Runner.app"
          OUTPUT="build/ios/ipa"

          test -d "$APP"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT/Payload"

          /usr/bin/ditto "$APP" "$OUTPUT/Payload/Runner.app"

          (
            cd "$OUTPUT"
            /usr/bin/ditto -c -k \
              --sequesterRsrc \
              --keepParent \
              Payload \
              Numination-unsigned.ipa
          )

          test -s "$OUTPUT/Numination-unsigned.ipa"
          unzip -t "$OUTPUT/Numination-unsigned.ipa"

          SHA256="$(shasum -a 256 "$OUTPUT/Numination-unsigned.ipa" | awk '{print $1}')"

          printf '%s  %s\n' \
            "$SHA256" \
            "Numination-unsigned.ipa" \
            > "$OUTPUT/SHA256SUMS-ios.txt"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-ios
          path: |
            build/ios/ipa/Numination-unsigned.ipa
            build/ios/ipa/SHA256SUMS-ios.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish multiplatform release
    needs:
      - android
      - ios
      - windows
      - linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Numination-*
          merge-multiple: true
          path: release-assets

      - name: Verify release files
        run: |
          set -euo pipefail

          cd release-assets

          for file in \
            Numination.apk \
            Numination-unsigned.ipa \
            Numination-Setup.exe \
            Numination-x86_64.AppImage \
            SHA256SUMS-android.txt \
            SHA256SUMS-ios.txt \
            SHA256SUMS-windows.txt \
            SHA256SUMS-linux.txt
          do
            test -s "$file"
          done

          sha256sum -c SHA256SUMS-android.txt
          sha256sum -c SHA256SUMS-ios.txt
          sha256sum -c SHA256SUMS-windows.txt
          sha256sum -c SHA256SUMS-linux.txt

          unzip -t Numination-unsigned.ipa

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.${{ github.run_number }}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Numination $TAG" \
              --notes "Multiplatform release of Numination."
          fi

          gh release upload "$TAG" \
            release-assets/Numination.apk \
            release-assets/SHA256SUMS-android.txt \
            release-assets/Numination-unsigned.ipa \
            release-assets/SHA256SUMS-ios.txt \
            release-assets/Numination-Setup.exe \
            release-assets/SHA256SUMS-windows.txt \
            release-assets/Numination-x86_64.AppImage \
            release-assets/Numination-x86_64.AppImage.asc \
            release-assets/SHA256SUMS-linux.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  windows:
    name: Windows Authenticode Installer
    needs: flutter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        shell: pwsh
        run: |
          $content = @"
          SUPABASE_URL=$env:SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$env:SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$env:API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          "@

          [System.IO.File]::WriteAllText(
            "$PWD/.env",
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Restore Windows signing certificate
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            throw 'Falta WINDOWS_PFX_BASE64.'
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw 'Falta WINDOWS_PFX_PASSWORD.'
          }

          $encoded = $env:WINDOWS_PFX_BASE64 -replace '\s', ''

          try {
            $bytes = [Convert]::FromBase64String($encoded)
          }
          catch {
            throw 'WINDOWS_PFX_BASE64 no es válido.'
          }

          if ($bytes.Length -eq 0) {
            throw 'El certificado está vacío.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'numination-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)

          if (!(Test-Path -LiteralPath $pfxPath) -or
              (Get-Item -LiteralPath $pfxPath).Length -eq 0) {
            throw 'No se pudo restaurar el PFX.'
          }

          "WINDOWS_PFX_PATH=$pfxPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host 'Certificado PFX restaurado.'

      - name: Validate Windows signing certificate
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          try {
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $env:WINDOWS_PFX_PATH,
              $env:WINDOWS_PFX_PASSWORD,
              $flags
            )
          }
          catch {
            throw 'No se pudo abrir el PFX. Comprueba WINDOWS_PFX_PASSWORD y que el archivo sea un PFX válido.'
          }

          if (!$certificate.HasPrivateKey) {
            throw 'El certificado PFX no contiene una llave privada.'
          }

          $now = [DateTime]::UtcNow
          if ($certificate.NotBefore.ToUniversalTime() -gt $now -or
              $certificate.NotAfter.ToUniversalTime() -le $now) {
            throw 'El certificado de firma todavía no es válido o ya venció.'
          }

          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $eku = $certificate.Extensions |
            Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            ForEach-Object { $_.Value }

          if ($eku -and $codeSigningOid -notin $eku) {
            throw 'El certificado no tiene permiso de uso para firma de código.'
          }

          $securePassword = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          try {
            $importedCertificates = Import-PfxCertificate `
              -FilePath $env:WINDOWS_PFX_PATH `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -Password $securePassword
          }
          catch {
            throw 'No se pudo importar el certificado PFX al almacén temporal del runner.'
          }

          $signingCertificate = $importedCertificates |
            Where-Object { $_.Thumbprint -eq $certificate.Thumbprint } |
            Select-Object -First 1

          if (!$signingCertificate -or !$signingCertificate.HasPrivateKey) {
            throw 'El certificado no quedó disponible con su llave privada en el almacén temporal.'
          }

          Write-Host "Certificado listo para firma: $($certificate.Subject)"
          Write-Host "Thumbprint: $($certificate.Thumbprint)"
          "SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $certificate.Dispose()

      - name: Generate Windows application icon
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build Windows ICO from official logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow

          @'
          from pathlib import Path
          from PIL import Image

          source = Image.open("assets/images/logo/logo_n.png").convert("RGBA")
          output = Path("windows/runner/resources/app_icon.ico")
          output.parent.mkdir(parents=True, exist_ok=True)

          source.save(
              output,
              format="ICO",
              sizes=[
                  (16, 16),
                  (24, 24),
                  (32, 32),
                  (48, 48),
                  (64, 64),
                  (128, 128),
                  (256, 256),
              ],
          )

          with Image.open(output) as icon:
              assert icon.format == "ICO"
          '@ | python -

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows `
            --release `
            --build-name "1.0.${{ github.run_number }}" `
            --build-number "${{ github.run_number }}"

      - name: Locate SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'

          $signtool = Get-ChildItem -Path "$kits\*\x64\signtool.exe" -File |
            Sort-Object {
              [version]$_.Directory.Parent.Name
            } -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (!$signtool) {
            throw 'No se encontró Windows SDK SignTool.'
          }

          "SIGNTOOL_PATH=$signtool" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SignTool: $signtool"

      - name: Sign Windows application
        timeout-minutes: 3
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mainExe = 'build/windows/x64/runner/Release/numination.exe'

          if (!(Test-Path -LiteralPath $mainExe)) {
            throw "No se encontró $mainExe"
          }

          if (!(Test-Path -LiteralPath $env:WINDOWS_PFX_PATH)) {
            throw 'No existe el certificado PFX.'
          }

          if (!(Test-Path -LiteralPath $env:SIGNTOOL_PATH)) {
            throw 'No existe SignTool.'
          }

          Write-Host 'Firmando numination.exe...'

          $signOutput = @(& $env:SIGNTOOL_PATH sign `
            /v `
            /fd SHA256 `
            /sha1 "$env:SIGNING_CERT_THUMBPRINT" `
            /tr 'http://timestamp.digicert.com' `
            /td SHA256 `
            "$mainExe" 2>&1)
          $signExitCode = $LASTEXITCODE
          $signOutput | ForEach-Object { Write-Host $_ }

          if ($signExitCode -ne 0) {
            $diagnostic = ($signOutput | ForEach-Object { "$($_)" }) -join "`n"
            if ($diagnostic.Length -gt 1800) { $diagnostic = $diagnostic.Substring(0, 1800) }
            $summary = @("## SignTool: numination.exe (exit $signExitCode)", '```text', $diagnostic, '```') -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
            throw "SignTool no pudo firmar numination.exe. Código $signExitCode. $diagnostic"
          }

          Write-Host 'Verificando firma...'

          & $env:SIGNTOOL_PATH verify /pa /v "$mainExe"

          if ($LASTEXITCODE -ne 0) {
            throw 'Falló la verificación de numination.exe.'
          }

          Write-Host 'Aplicación firmada correctamente.'

      - name: Install Inno Setup
        timeout-minutes: 5
        run: choco install innosetup --yes --no-progress

      - name: Build and sign installer
        timeout-minutes: 5
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'

          if (!(Test-Path -LiteralPath $iscc)) {
            throw "No se encontró ISCC.exe: $iscc"
          }

          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "windows/installer/Numination.iss"

          if ($LASTEXITCODE -ne 0) {
            throw 'Falló Inno Setup.'
          }

          $installer = 'build/windows/package/Numination-Setup.exe'

          if (!(Test-Path -LiteralPath $installer)) {
            throw 'No se generó Numination-Setup.exe.'
          }

          Write-Host 'Firmando instalador...'

          $signOutput = @(& $env:SIGNTOOL_PATH sign `
            /v `
            /fd SHA256 `
            /sha1 "$env:SIGNING_CERT_THUMBPRINT" `
            /tr 'http://timestamp.digicert.com' `
            /td SHA256 `
            "$installer" 2>&1)
          $signExitCode = $LASTEXITCODE
          $signOutput | ForEach-Object { Write-Host $_ }

          if ($signExitCode -ne 0) {
            $diagnostic = ($signOutput | ForEach-Object { "$($_)" }) -join "`n"
            if ($diagnostic.Length -gt 1800) { $diagnostic = $diagnostic.Substring(0, 1800) }
            $summary = @("## SignTool: instalador (exit $signExitCode)", '```text', $diagnostic, '```') -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
            throw "SignTool no pudo firmar el instalador. Código $signExitCode. $diagnostic"
          }

          Write-Host 'Verificando instalador...'

          & $env:SIGNTOOL_PATH verify /pa /v "$installer"

          if ($LASTEXITCODE -ne 0) {
            throw 'Falló la verificación Authenticode del instalador.'
          }

          $sha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          "$sha  Numination-Setup.exe" |
            Set-Content -Encoding ascii 'build/windows/package/SHA256SUMS-windows.txt'

          Write-Host "Windows installer SHA-256: $sha"

          Remove-Item -LiteralPath $env:WINDOWS_PFX_PATH -Force
          Remove-Item Env:WINDOWS_PFX_PASSWORD -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-windows
          path: |
            build/windows/package/Numination-Setup.exe
            build/windows/package/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux AppImage
    needs: flutter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Create CI environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<ENV
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          SUPABASE_AUTH_GOOGLE_CLIENT_ID=$SUPABASE_AUTH_GOOGLE_CLIENT_ID
          API_BASE_URL=$API_BASE_URL
          SUPABASE_AUTH_REDIRECT_URL=numination://auth
          APP_VERSION=1.0.${{ github.run_number }}
          ENV

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libfuse2 \
            libglib2.0-dev \
            librsvg2-dev \
            libblkid-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            file

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux
        run: |
          set -euo pipefail

          pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1 OK" || { echo "webkit2gtk-4.1 MISSING"; exit 1; }

          flutter build linux \
            --release \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"

      - name: Package AppImage
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail

          BUNDLE="build/linux/x64/release/bundle"
          APPDIR="$RUNNER_TEMP/AppDir"
          OUTPUT="build/linux/package/Numination-x86_64.AppImage"
          TOOLS="$RUNNER_TEMP/linuxdeploy"
          APP_BIN_DIR="$APPDIR/usr/bin"

          test -d "$BUNDLE"
          test -x "$BUNDLE/numination" || test -x "$BUNDLE/usr/bin/numination" || {
            echo "Binary not found. Contents of bundle:"
            find "$BUNDLE" -type f -executable | head -20
            exit 1
          }

          mkdir -p "$TOOLS" "$(dirname "$OUTPUT")" "$APP_BIN_DIR" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          if [ -x "$BUNDLE/numination" ]; then
            # Keep Flutter's executable, data/, and lib/ together. The executable
            # resolves both assets and plugin libraries relative to its directory.
            cp -a "$BUNDLE/." "$APP_BIN_DIR/"
          else
            cp -a "$BUNDLE/usr/." "$APPDIR/usr/"
          fi

          DESKTOP="$APPDIR/usr/share/applications/Numination.desktop"
          if [ ! -f "$DESKTOP" ]; then
            cat > "$DESKTOP" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Numination
          Comment=Numination AI workspace
          Exec=numination
          Icon=numination
          Categories=Development;IDE;
          Terminal=false
          EOF
          fi

          ICON_SRC=""
          for candidate in \
            assets/images/logo/logo_n.png \
            assets/images/logo/logo.png \
            "$APPDIR/data/flutter_assets/assets/images/logo/logo_n.png"
          do
            if [ -f "$candidate" ]; then
              ICON_SRC="$candidate"
              break
            fi
          done

          if [ -n "$ICON_SRC" ]; then
            ICON_VENV="$RUNNER_TEMP/icon-venv"

            python3 -m venv "$ICON_VENV"
            "$ICON_VENV/bin/pip" install --disable-pip-version-check --quiet Pillow

            "$ICON_VENV/bin/python" - "$ICON_SRC" "$APPDIR/numination.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/numination.png" <<'PY_ICON'
          import sys
          from PIL import Image

          source_path, output_512, output_256 = sys.argv[1:]
          image = Image.open(source_path).convert("RGBA")

          def make_icon(size, destination):
              resized = image.copy()
              resized.thumbnail((size, size), Image.Resampling.LANCZOS)

              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              x = (size - resized.width) // 2
              y = (size - resized.height) // 2
              canvas.alpha_composite(resized, (x, y))
              canvas.save(destination, format="PNG")

          make_icon(512, output_512)
          make_icon(256, output_256)
          print("Iconos generados: 512x512 y 256x256")
          PY_ICON
          else
            echo "ERROR: No se encontró el logo de Numination."
            exit 1
          fi

          curl -fsSL --retry 3 -o "$TOOLS/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$TOOLS/linuxdeploy-x86_64.AppImage"

          curl -fsSL --retry 3 -o "$TOOLS/linuxdeploy-plugin-gtk.sh" \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x "$TOOLS/linuxdeploy-plugin-gtk.sh"
          mv "$TOOLS/linuxdeploy-plugin-gtk.sh" "$TOOLS/linuxdeploy-plugin-gtk"

          export PATH="$TOOLS:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export LINUXDEPLOY_OUTPUT_APP_NAME=Numination
          export LINUXDEPLOY_OUTPUT_VERSION="$APP_VERSION"
          export OUTPUT="$OUTPUT"
          export LD_LIBRARY_PATH="$APP_BIN_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          "$TOOLS/linuxdeploy-x86_64.AppImage" \
            --appdir "$APPDIR" \
            --executable "$APP_BIN_DIR/numination" \
            --desktop-file "$DESKTOP" \
            --icon-file "$APPDIR/numination.png" \
            --plugin gtk \
            --output appimage

          test -s "$OUTPUT"
          echo "AppImage created: $OUTPUT ($(du -h "$OUTPUT" | cut -f1))"

      - name: Sign AppImage with GPG
        env:
          LINUX_GPG_PRIVATE_KEY_B64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_B64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          : "${LINUX_GPG_PRIVATE_KEY_B64:?Missing LINUX_GPG_PRIVATE_KEY_B64 secret}"

          KEY_FILE="$RUNNER_TEMP/numination-gpg-private.asc"
          OUTPUT="build/linux/package/Numination-x86_64.AppImage"

          printf '%s' "$LINUX_GPG_PRIVATE_KEY_B64" \
            | tr -d '\r\n' \
            | base64 --decode > "$KEY_FILE"

          test -s "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          gpg --batch --yes --import "$KEY_FILE"

          gpg --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$LINUX_GPG_PASSPHRASE" \
            --armor \
            --detach-sign \
            --output "${OUTPUT}.asc" \
            "$OUTPUT"

          gpg --batch --verify "${OUTPUT}.asc" "$OUTPUT"

          SHA256="$(sha256sum "$OUTPUT" | awk '{print $1}')"

          printf '%s  %s\n' \
            "$SHA256" \
            "Numination-x86_64.AppImage" \
            > build/linux/package/SHA256SUMS-linux.txt

          rm -f "$KEY_FILE"
          unset LINUX_GPG_PRIVATE_KEY_B64
          unset LINUX_GPG_PASSPHRASE

          echo "Linux GPG signature verified."
          echo "SHA-256: $SHA256"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Numination-linux
          path: |
            build/linux/package/Numination-x86_64.AppImage
            build/linux/package/Numination-x86_64.AppImage.asc
            build/linux/package/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

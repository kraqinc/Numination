name: Build Android

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p android/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/keystore/numination-release.jks

          test -s android/keystore/numination-release.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: numination
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Prepare APK
        run: |
          set -euo pipefail

          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          APK="build/app/outputs/flutter-apk/Numination.apk"
          CHECKSUM="build/app/outputs/flutter-apk/SHA256SUMS.txt"

          test -f "$APK_SOURCE"

          cp "$APK_SOURCE" "$APK"

          APK_SIZE="$(stat -c%s "$APK")"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

          sha256sum "$APK" > "$CHECKSUM"

          echo "APK prepared:"
          ls -lh "$APK"
          echo "SHA-256:"
          cat "$CHECKSUM"

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/Numination.apk"

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner verify \
            --verbose \
            "$APK"

          echo "APK signature verification passed."

      - name: Determine release tag
        id: release
        run: |
          set -euo pipefail

          TAG="v1.0.165"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          APK="build/app/outputs/flutter-apk/Numination.apk"
          CHECKSUM="build/app/outputs/flutter-apk/SHA256SUMS.txt"
          EXPECTED_SHA="c59dd93b86e32cfeb9eace9e716e7e9408b41dc1"

          test -f "$APK"
          test -f "$CHECKSUM"

          echo "Checking whether tag $TAG already exists..."

          if gh api \
            "repos/kraqinc/Numination/git/ref/tags/$TAG" \
            >/dev/null 2>&1; then

            TAG_SHA="$(gh api \
              "repos/kraqinc/Numination/git/ref/tags/$TAG" \
              --jq '.object.sha')"

            echo "Existing tag SHA:"
            echo "$TAG_SHA"

            if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
              echo ""
              echo "ERROR: Release tag $TAG points to:"
              echo "$TAG_SHA"
              echo ""
              echo "But this APK was built from:"
              echo "$EXPECTED_SHA"
              echo ""
              echo "Refusing to publish a mismatched release."
              exit 1
            fi

            echo "Tag points to the expected commit."

          else
            echo "Tag $TAG does not exist yet."
            echo "The release creation step will create it."
          fi

          DESCRIPTION="$(cat <<EOF
          ## Numination $TAG

          **Numination AI — AI Workspace & Shell**

          La IA para quienes resuelven problemas.

          ### Android

          - **APK:** \`Numination.apk\`
          - **Tamaño:** ${APK_SIZE} bytes
          - **SHA-256:** \`${APK_SHA256}\`
          - **Firma:** verificada
          - **Build:** 165
          - **Commit:** \`${EXPECTED_SHA}\`

          ### Integridad del APK

          Este es exactamente el mismo APK generado y validado por GitHub Actions en esta ejecución.

          El archivo publicado en Releases no se recompila ni se genera nuevamente.
          Se publica directamente el APK producido por el job de Android.

          SHA-256 oficial:

          \`${APK_SHA256}\`

          ### Build information

          - Flutter: 3.47.0
          - Version: 1.0.165
          - Commit: \`${EXPECTED_SHA}\`
          - APK signature verification: passed
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release $TAG already exists."
            echo "Uploading APK and checksum..."

            gh release upload \
              "$TAG" \
              "$APK" \
              "$CHECKSUM" \
              --clobber

            gh release edit "$TAG" \
              --title "Numination $TAG" \
              --notes "$DESCRIPTION"

          else

            echo "Creating release $TAG..."

            gh release create \
              "$TAG" \
              "$APK" \
              "$CHECKSUM" \
              --title "Numination $TAG" \
              --notes "$DESCRIPTION"

          fi

          echo ""
          echo "========================================"
          echo "Release published successfully"
          echo "========================================"
          echo "Tag: $TAG"
          echo "APK: Numination.apk"
          echo "Size: ${APK_SIZE} bytes"
          echo "SHA-256: ${APK_SHA256}"
          echo "Commit: ${EXPECTED_SHA}"
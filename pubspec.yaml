name: numination
description: Numination - AI development workspace
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/numination_logo_wordmark.png

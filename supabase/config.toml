project_id = "whxqciwphwgzcshejpty"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["numination://auth", "numination://auth/**"]
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_CLIENT_SECRET)"
redirect_uri = ""

[auth.email]
enabled = true
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
host = "env(SUPABASE_SMTP_HOST)"
port = 587
user = "env(SUPABASE_SMTP_USER)"
pass = "env(SUPABASE_SMTP_PASSWORD)"
admin_email = "env(SUPABASE_SMTP_ADMIN_EMAIL)"
sender_name = "env(SUPABASE_SMTP_SENDER_NAME)"
